<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0a">
    <title>أرسنال مع أبو سو</title>

    <style>
        /* =========================
           BODY & BACKGROUNDS
        ========================= */
        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            color: white;
            text-align: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            background-color: #0a0a0a;
        }

        /* خلفية ثابتة للكمبيوتر */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("desktop-bg.jpg"); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -3; 
        }

        /* طبقة تعتيم خفيف */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5); 
            z-index: -2;
        }

        /* حل مشكلة الآيفون للـ الجوال */
        @media (max-width: 768px) {
            body::before {
                background-image: url("mobile-bg.jpg");
                background-size: cover;
                background-position: center;
                background-attachment: scroll !important;
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
            }
        }

        /* زخرفة متحركة دائرية مستقلة */
        .bg-animation {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: repeating-linear-gradient(
                45deg,
                rgba(255, 255, 255, 0.03) 0px,
                rgba(255, 255, 255, 0.03) 2px,
                transparent 2px,
                transparent 40px
            );
            animation: rotateBg 35s linear infinite;
            z-index: -1;
            pointer-events: none; 
        }

        @keyframes rotateBg {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* =========================
           ELEMENTS STYLES
        ========================= */
        header {
            background: rgba(220, 38, 38, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 20px;
            font-size: 28px;
            font-weight: bold;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 25px;
        }

        .section {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            margin: 20px 0;
            padding: 22px;
            border-radius: 15px;
            cursor: pointer;
            transition: .3s;
        }

        .section:hover {
            background: #dc2626;
            border-color: #ff3131;
            box-shadow: 0 0 15px rgba(220, 38, 38, 0.4);
            transform: translateY(-2px);
        }

        .section a {
            color: white;
            text-decoration: none;
            display: block;
            font-size: 22px;
            font-weight: bold;
        }

        .back {
            margin-top: 30px;
        }

        .back a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: .3s;
        }
        
        .back a:hover {
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body>

    <div class="bg-animation"></div>

    <header>
        🔴 أرسنال مع أبو سو
    </header>

    <div class="container">

        <div class="section">
            <a href="arsenal-ratings.html">
                ١- تقييم لاعبين أرسنال موسم 25/26 🏆
            </a>
        </div>

        <div class="section" style="color: rgba(255,255,255,0.5); cursor: default;">
            قريباً ...
        </div>

        <div class="back">
            <a href="index.html">⬅ العودة للرئيسية</a>
        </div>

    </div>

</body>
</html>
